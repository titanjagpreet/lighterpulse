name: Open interest collector

# Lighter publishes no open-interest history, so this records it. Scheduled
# workflows run only from the default branch, can be delayed at busy times
# (the top of the hour most of all — hence the offsets), and GitHub disables
# them after 60 days without repository activity.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: oi-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
