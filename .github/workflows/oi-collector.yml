name: Open interest collector

# A backstop, not the main trigger. The website's /api/collector, called every
# 15 minutes by an external scheduler, records history. GitHub's scheduled
# workflows are best-effort: set to every 15 minutes, this one ran only every
# 2–7 hours. Hourly is enough for a backstop, since a second run in the same 15
# minutes adds nothing, and it stays well inside the free minutes if the
# repository is ever made private. Scheduled workflows run only from the
# default branch, and GitHub disables them after 60 days without activity.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: oi-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
